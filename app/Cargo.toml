[package]
name = "fastrixi"
default-run = "fastrixi"
description = "lightweight tool for minecraft botting"
version.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "fastrixi"
path = "src/main.rs"

[lib]
name = "fastrixi_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
fastrixi-kernel.workspace = true
fastrixi-extensions.workspace = true
azalea.workspace = true
tauri = { version = "2.11.0", features = [] }
tokio.workspace = true
aes-gcm.workspace = true
serde.workspace = true
serde_json.workspace = true
socks5-impl.workspace = true
reqwest.workspace = true
chrono.workspace = true
rand.workspace = true
regex.workspace = true
memory-stats.workspace = true
open.workspace = true
once_cell.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
dns-lookup.workspace = true
discord-presence.workspace = true
hashbrown.workspace = true
dirs.workspace = true
systemstat.workspace = true
bytes.workspace = true
